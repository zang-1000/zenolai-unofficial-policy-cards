<script>

// 機率(%)：0=SSR 5；6、7、10=SR 各約8.33（合計25）；其餘7張普通卡各10（合計70）
const PW=[5,10,10,10,10,10,25/3,25/3,10,10,25/3];
const pickW=()=>{const n=FRONTS.length,u=new Uint32Array(1);crypto.getRandomValues(u);let x=u[0]/4294967296*100;for(let k=0;k<n;k++){x-=PW[k];if(x<0)return k;}return n-1;};

  uniforms:{uTime:{value:0},uScale:{value:H/(2*Math.tan(10*Math.PI/180))}},
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`attribute float aSize;attribute float aPhase;attribute float aSpeed;attribute vec3 aColor;
  uniform float uTime;uniform float uScale;varying float vA;varying vec3 vC;
  void main(){vec3 p=position;float d=6.4-p.z;float hh=d*0.1763*1.08;float hw=hh*0.5625;

  fragmentShader:`varying float vA;varying vec3 vC;
  void main(){float d=length(gl_PointCoord-0.5);float a=smoothstep(0.5,0.0,d);a*=a;gl_FragColor=vec4(vC,a*vA);}`
 });

})();
function updateBG(T){

}
const Y0=1.95,ease=x=>1-Math.pow(1-x,3);
// SSR 專屬：環繞卡牌的金色光粒子（純粒子，無線條）
const holy=(function(){
  const N=2000,pos=new Float32Array(N*3),siz=new Float32Array(N),alp=new Float32Array(N),vel=new Float32Array(N*3),age=new Float32Array(N).fill(99),life=new Float32Array(N),ph=new Float32Array(N);
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 g.setAttribute('aSize',new THREE.BufferAttribute(siz,1));
 g.setAttribute('aAlpha',new THREE.BufferAttribute(alp,1));
 const pm=new THREE.ShaderMaterial({uniforms:{uScale:{value:H/(2*Math.tan(10*Math.PI/180))}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`attribute float aSize;attribute float aAlpha;varying float vA;
  void main(){vA=aAlpha;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=aSize*uScale/-mv.z;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vA;
  void main(){float d=length(gl_PointCoord-0.5);float core=smoothstep(0.5,0.0,d);core*=core;
  float soft=pow(smoothstep(0.5,0.0,d),1.4);
  vec3 col=mix(vec3(1.0,0.74,0.26),vec3(1.0,0.97,0.8),core*0.8);
  gl_FragColor=vec4(col,(soft*0.8+core*0.7)*vA);}`});
 const pts=new THREE.Points(g,pm);pts.frustumCulled=false;pts.renderOrder=3;scene.add(pts);
 let acc=0,idx=0,on=false;
 function spawn(cy,wf,burst){
  const i=idx;idx=(idx+1)%N;
  const hw=CW/2,hh=CH/2,a=Math.random()*6.2832,c=Math.cos(a),s=Math.sin(a);
  const r=1/Math.max(Math.abs(c)/hw,Math.abs(s)/hh);
  const glow=Math.random()<0.22;const out=(burst?0.0:Math.random()*0.5)+(glow?0.05:0.02);
  const dx=c/Math.hypot(c/hw,s/hh)*0+c,dy=s;
  const L=Math.hypot(dx,dy)||1;
  pos[i*3]=(c*r+dx/L*out)*wf;pos[i*3+1]=cy+s*r+dy/L*out;pos[i*3+2]=glow?-0.08-Math.random()*0.35:(Math.random()-0.35)*0.4;
  const sp=burst?0.22+Math.random()*0.22:0.015+Math.random()*0.07;
  vel[i*3]=dx/L*sp*wf+(Math.random()-0.5)*0.03;vel[i*3+1]=dy/L*sp+0.02+Math.random()*0.08;vel[i*3+2]=0;
  age[i]=0;life[i]=glow?2.2+Math.random()*1.8:1.6+Math.random()*1.8;siz[i]=glow?0.16+Math.random()*0.14:0.035+Math.pow(Math.random(),2)*0.09;ph[i]=Math.random()*6.28;
 }
 return{
  set(v){on=v;acc=0;},
  burst(cy){if(!on)return;for(let k=0;k<300;k++)spawn(cy,1,true);},
  update(cy,ry,dt,falling){
   const wf=Math.max(0.12,Math.abs(Math.cos(ry)));
   if(on)acc+=dt*(falling?650:240);
   while(acc>=1){spawn(cy,wf,false);acc--;}
   for(let i=0;i<N;i++){
    if(age[i]<life[i]){age[i]+=dt;pos[i*3]+=vel[i*3]*dt;pos[i*3+1]+=vel[i*3+1]*dt;
     alp[i]=Math.sin(Math.PI*Math.min(age[i]/life[i],1))*(0.75+0.25*Math.sin(age[i]*7+ph[i]));}
    else alp[i]=0;
   }
   g.attributes.position.needsUpdate=true;g.attributes.aAlpha.needsUpdate=true;g.attributes.aSize.needsUpdate=true;
  }};
})();
const glintMat=new THREE.ShaderMaterial({uniforms:{uK:{value:-1}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:"varying vec2 vP;void main(){vP=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",

 void main(){
  vec2 dir=normalize(vec2(${CW},${CH}));

  if(keepAudio.paused){const pp=keepAudio.play();if(pp&&pp.catch)pp.catch(()=>{});}}catch(e){}

 [329.63,440,523.25,659.25].forEach(f=>{[-4,4].forEach(cents=>{

  o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.2,t+dur);
  o.connect(g);g.connect(sw);o.start(t);o.stop(t+dur+0.1);
 });});
 const fs=[1046.5,1318.5,1568,1760,2093,2637];
 for(let i=0;i<16;i++){
  const st=t+0.15+Math.random()*Math.max(0.2,dur-0.5),o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.value=fs[Math.floor(Math.random()*fs.length)];
  g.gain.setValueAtTime(0.0001,st);g.gain.linearRampToValueAtTime(0.028,st+0.015);g.gain.exponentialRampToValueAtTime(0.0001,st+0.55);
  o.connect(g);
  if(hasPan){const sp=ac.createStereoPanner();sp.pan.value=Math.random()*2-1;g.connect(sp);sp.connect(master);sp.connect(fx);}
  else{g.connect(master);g.connect(fx);}
  o.start(st);o.stop(st+0.6);
 }
}
function sndMagic(){
 if(!sndLive())return;const t=ac.currentTime+0.1;
 bell(t,2093,0.11,0.7);
 bell(t+0.17,1568,0.14,1.6);
 [1046.5,1318.5,1568].forEach(fr=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=fr;
  g.gain.setValueAtTime(0.0001,t+0.1);g.gain.linearRampToValueAtTime(0.022,t+0.35);g.gain.exponentialRampToValueAtTime(0.0001,t+2.2);
  o.connect(g);g.connect(fx);o.start(t+0.1);o.stop(t+2.3);});
}
const sb=document.createElement('button');
sb.setAttribute('aria-label','音效開關');
sb.style.cssText='position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.35);color:#fff;font-size:20px;line-height:1;padding:0;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:manipulation';
const paintSb=()=>{sb.textContent=soundOn?'🔊':'🔇';};paintSb();
sb.addEventListener('pointerdown',e=>{e.stopPropagation();});
sb.addEventListener('click',()=>{
 // 音效尚未啟用時按下：視為「要開聲音」，不要反而切成靜音
 const locked=!!AC&&(!ac||ac.state!=='running');
 if(!(soundOn&&locked))soundOn=!soundOn;
 try{localStorage.setItem('snd',soundOn?'1':'0');}catch(e){}paintSb();
 unlock().then(()=>{if(sndLive())bell(ac.currentTime+0.03,1568,0.12,0.5);});
});
document.body.appendChild(sb);
let whooshed=false,magicDone=false,spinDone=false;
let phase=0,ts=0;
const hint=document.getElementById('hint');
function frame(now){
 requestAnimationFrame(frame);updateBG(now/1000);
 const dt=Math.min(Math.max((now-lastNow)/1000,0),0.05);lastNow=now;
 const t=t0===null?0:Math.max(0,(now-t0)/1000);
 let y=0,ry=Math.PI;
 if(phase===0){
  if(!whooshed&&t0!==null&&t<0.3&&sndLive()){whooshed=true;sndFall();}
  if(t>=1.5){phase=1;if(hint)hint.style.opacity=1;if(holy)holy.burst(0);}
  else y=Y0*(1-ease(t/1.5));
 }
 if(phase===2){
  const sp=(now-ts)/1000;
  if(!spinDone&&sp<0.6&&sndLive()){spinDone=true;sndSpin(2.5-sp);}
  if(!magicDone&&sp>=2.25){magicDone=true;sndMagic();}
  if(sp>=2.5){phase=3;rotY=8*Math.PI;vel=0;setTimeout(()=>{if(phase===3)redo.classList.add("on");},700);}
  else ry=Math.PI+7*Math.PI*ease(sp/2.5);
 }
 if(phase===3){
  if(!drag){rotY+=vel*dt;vel*=Math.exp(-3*dt);if(Math.abs(vel)<0.001)vel=0;}
  ry=rotY;
 }
 card.position.y=y;card.rotation.y=ry;
 let gk=-1;if(phase>=2)gk=((now-ts)/1000-2.3)/0.9;
 glintMat.uniforms.uK.value=(gk<0||gk>1)?-1:gk*gk*(3-2*gk);
 if(holy)holy.update(y,ry,dt,phase===0);
 renderer.render(scene,camera);
}
holy.set(curIdx===0);
let texReady=true,pending=null;
function loadFront(i){return new Promise((res,rej)=>new THREE.TextureLoader().load(FRONTS[i],t=>{
 t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();
 t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;
 try{renderer.initTexture(t);}catch(e){}
 res(t);},undefined,rej));}
// 預先抽好下一張並先載入，按《重新抽選》時就不用等下載
function prepNext(){const i=pickNext(curIdx);pending={i,p:loadFront(i)};pending.p.catch(()=>{});}
Promise.all([face(FRONT,false),face(BACK,true),bgP]).then(()=>{
 const ld=document.getElementById('load');if(ld)ld.style.opacity=0;
 requestAnimationFrame(n=>{t0=n;});
 requestAnimationFrame(frame);
 prepNext();
});
const redo=document.getElementById('redo');
function restart(){
 if(phase!==3)return;
 redo.classList.remove('on');drag=false;vel=0;
 if(!pending)prepNext();
 const {i:next,p}=pending;pending=null;remember(next);
 // 立刻開始落下動畫（落下時看到的是卡背），正面圖在翻牌前換好即可
 curIdx=next;holy.set(curIdx===0);texReady=false;
 phase=0;t0=performance.now();whooshed=false;magicDone=false;spinDone=false;
 const swap=t=>{if(curIdx!==next){t.dispose();return;}
  const old=frontMat.map;frontMat.map=t;frontMat.needsUpdate=true;if(old&&old!==t)old.dispose();
  texReady=true;prepNext();};
 p.then(swap,()=>loadFront(next).then(swap,()=>{texReady=true;prepNext();}));
}
redo.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();restart();});
redo.addEventListener('click',restart);
const cv=renderer.domElement;
const radPerPx=()=>Math.PI/(cv.clientWidth*0.8);
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
addEventListener('pointerdown',e=>{
 if(phase===1){
  const r=cv.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-(((e.clientY-r.top)/r.height)*2-1));
  ray.setFromCamera(ndc,camera);
  if(texReady&&ray.intersectObject(card,true).length){phase=2;ts=performance.now();magicDone=false;spinDone=false;if(hint)hint.style.opacity=0;}
  return;
 }
 if(phase!==3)return;
 drag=true;lastX=e.clientX;lastT=e.timeStamp;vel=0;
});
addEventListener('pointermove',e=>{if(!drag)return;
 const dx=e.clientX-lastX,dtm=Math.max((e.timeStamp-lastT)/1000,0.008);
 lastX=e.clientX;lastT=e.timeStamp;
 const d=dx*radPerPx();rotY+=d;
 vel=0.6*vel+0.4*(d/dtm);});
const endDrag=e=>{if(!drag)return;drag=false;if((e.timeStamp-lastT)>80)vel=0;vel=Math.max(-25,Math.min(25,vel));};
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
